[project]
name = "brisart-identity-tools"
version = "0.7.0b0"
description = "Dependency-free local identity tooling: a BSR2-encrypted record vault, local biometric verification with sealed templates, and identity-bound packages."
readme = "README.md"
# 3.10 is the floor because vendored BSR2 uses PEP 604 (`int | None`) in
# runtime-evaluated annotations without `from __future__ import annotations`.
# Patching that would break byte-identical vendoring and the digest pin in
# tests/test_bsr2_vendor_integrity.py, which is worth more than 3.9 support.
requires-python = ">=3.10"
# LICENSE points at the Brisart ecosystem licensing terms rather than embedding
# an SPDX-recognised license text, so no SPDX identifier is asserted here.
license = { file = "LICENSE" }
authors = [{ name = "Jason Brisart" }]
keywords = ["identity", "biometrics", "custody", "research", "beta"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JasonBrisart/BrisartIdentityTools"
Issues = "https://github.com/JasonBrisart/BrisartIdentityTools/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
# bsr2_vendor/ holds BSR2 vendored byte-identical from upstream and pinned by
# digest in tests/test_bsr2_vendor_integrity.py. Linting it would invite edits
# that break that pin, so it is excluded rather than fixed.
extend-exclude = ["__pycache__", "bsr2_vendor"]

[tool.ruff.lint]
# Rules that catch real defects. Style-only and naming rules are deliberately
# left out: the three application trees predate this config and use directory
# names (IdentityVault_beta, LabID_Beta) that N999 would reject wholesale.
select = [
  "F",      # pyflakes: undefined names, unused imports, bad f-strings
  "E4",     # import formatting errors
  "E7",
  "E9",     # syntax and runtime errors
  "W",      # whitespace warnings
  "B",      # flake8-bugbear: likely bugs
  "DTZ",    # naive datetime usage
  "RUF013", # implicit Optional
  "PLE",    # pylint errors
  "PLW",    # pylint warnings
  "S102",   # exec
  "S307",   # eval
  "S324",   # insecure hash for security purposes
  "S608",   # SQL injection
]
ignore = [
  # The demo/CLI layers intentionally catch broad exceptions to print a clean
  # error message and exit non-zero rather than dumping a traceback.
  "BLE001",
  # Bare `raise ... from` chaining is not consistently applied in this codebase
  # yet; tracked separately from the beta hardening work.
  "B904",
  # zip() without strict= is fine on the fixed-length template vectors here.
  "B905",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately pass wrong types to assert on the resulting errors.
"**/tests/*.py" = ["S101", "PLR2004"]
# This suite bootstraps sys.path before importing the application modules so it
# still works when run directly (python tests/test_sealed_labid_flow.py), where
# conftest.py is not loaded. The imports must follow that bootstrap.
"LabID_Beta/tests/test_sealed_labid_flow.py" = ["S101", "PLR2004", "E402"]
