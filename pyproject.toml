# BrisartIdentityTools is cloned and run in place (python cli.py ...,
# python run_tests.py); it is never built as a wheel or published to PyPI, so
# it intentionally declares no [project] metadata and no [build-system]. The
# single source of truth for the version is version.py (__version__), imported
# by vault/ and biometrics/ settings. This file exists only to configure ruff,
# which the CI lint job runs as `ruff check .`.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["__pycache__", "vendor"]

[tool.ruff.lint]
select = [
  "F",
  "E4",
  "E7",
  "E9",
  "W",
  "B",
  "DTZ",
  "PLE",
  "PLW",
  "S102",
  "S307",
  "S324",
  "S608",
]
ignore = [
  "BLE001",
  "B904",
  "B905",
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "PLR2004"]
"**/tests/*.py" = ["S101", "PLR2004", "B017"]
"biometrics/tests/test_sealed_biometrics_flow.py" = ["S101", "PLR2004", "E402", "B017"]
"gui/app.py" = ["E402", "F841"]