[project]
name = "brisart-identity-tools"
version = "1.0.0"
description = "Dependency-free local identity tooling: a BSR2-encrypted record vault, local biometric verification with sealed templates, and identity-bound packages -- with a Tkinter desktop GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jason Brisart" }]
keywords = ["identity", "biometrics", "custody", "research", "gui"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JasonBrisart/BrisartIdentityTools"
Issues = "https://github.com/JasonBrisart/BrisartIdentityTools/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["__pycache__", "vendor"]

[tool.ruff.lint]
select = [
  "F",
  "E4",
  "E7",
  "E9",
  "W",
  "B",
  "DTZ",
  "RUF013",
  "PLE",
  "PLW",
  "S102",
  "S307",
  "S324",
  "S608",
]
ignore = [
  "BLE001",
  "B904",
  "B905",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101", "PLR2004"]
"biometrics/tests/test_sealed_biometrics_flow.py" = ["S101", "PLR2004", "E402"]
